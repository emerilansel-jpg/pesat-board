# Pesat Board — board.pesat.ai
# Install: cp ke /etc/nginx/sites-available/pesat-board, ln -s ke sites-enabled, nginx -t && systemctl reload nginx
# Traffic: Cloudflare Tunnel (cloudflared-permanent) -> nginx :80 dengan Host board.pesat.ai

server {
    listen 80;
    server_name board.pesat.ai;

    root /var/www/pesat-board/app;
    index index.html;
    client_max_body_size 50m;

    # API backend (PM2 pesat-board-api :3400)
    location /api/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.IO realtime (websocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Uploads (attachment card & media WA) — langsung dari disk
    location /uploads/ {
        alias /var/www/pesat-board/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service worker PWA: jangan di-cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html: selalu fresh
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Static assets hasil build (hashed): cache panjang
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
