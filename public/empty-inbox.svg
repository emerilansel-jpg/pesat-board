<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none">
  <!-- phone -->
  <rect x="70" y="50" width="130" height="230" rx="20" fill="#fff" stroke="#7C3AED" stroke-width="2"/>
  <rect x="112" y="62" width="46" height="8" rx="4" fill="#EDE9FE"/>
  <!-- WA bubble coming out of screen -->
  <g>
    <path d="M96 110h86a14 14 0 0 1 14 14v34a14 14 0 0 1-14 14h-58l-16 14v-14h-12a14 14 0 0 1-14-14v-34a14 14 0 0 1 14-14Z" fill="#D9FDD3" stroke="#25D366" stroke-width="2"/>
    <rect x="98" y="126" width="70" height="8" rx="4" fill="#25D366" opacity=".35"/>
    <rect x="98" y="140" width="48" height="8" rx="4" fill="#25D366" opacity=".25"/>
  </g>
  <!-- second bubble -->
  <rect x="92" y="196" width="88" height="34" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" opacity=".8"/>
  <rect x="104" y="209" width="56" height="8" rx="4" fill="#7C3AED" opacity=".3"/>
  <!-- dashed arrow to kanban card -->
  <path d="M215 150 C 270 150 280 120 318 108" stroke="#25D366" stroke-width="2" stroke-dasharray="6 6" fill="none"/>
  <path d="M310 100l12 5-10 8z" fill="#25D366"/>
  <!-- mini kanban card -->
  <g transform="rotate(4 370 110)">
    <rect x="322" y="70" width="110" height="76" rx="10" fill="#fff" stroke="#7C3AED" stroke-width="2"/>
    <rect x="334" y="84" width="60" height="9" rx="4.5" fill="#EDE9FE"/>
