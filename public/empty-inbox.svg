    <rect x="334" y="118" width="26" height="12" rx="6" fill="#25D366" opacity=".55"/>
    <!-- double tick -->
    <path d="M376 124l3.5 3.5 6-7M385 124l3.5 3.5 6-7" stroke="#53BDEB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- sparkles -->
  <g stroke="#7C3AED" stroke-width="2" stroke-linecap="round">
    <path d="M250 60v12M244 66h12" opacity=".6"/>
    <path d="M420 200v10M415 205h10" opacity=".4"/>
